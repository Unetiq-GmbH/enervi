name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C /tmp
          /tmp/gitleaks detect --source . --redact --verbose

  lint:
    runs-on: ubuntu-latest
    container: node:18
    steps:
      - name: Checkout HEAD
        uses: actions/checkout@v4

      - name: Lint
        env:
          NODE_ENV: test
        run: |
          npm ci --prefix frontend
          npm run lint --prefix frontend
          npm ci --prefix backend
          npm run lint --prefix backend

  test:
    runs-on: ubuntu-latest
    container: node:18
    steps:
      - name: Checkout HEAD
        uses: actions/checkout@v4

      - name: Test
        env:
          NODE_ENV: test
        run: |
          npm ci --prefix backend
          npm run test --prefix backend
