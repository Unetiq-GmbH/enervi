# Local API container. Create a .env file from .env.example first.
# Compose reads .env for ${VAR} interpolation and does not bake values into the image.
services:
  backend:
    build: ./backend
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5001}
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_TLS: ${MONGODB_TLS:-false}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      EXPRESS_FLASK_KEY: ${EXPRESS_FLASK_KEY:-}
      DEV_GPU_URL: ${DEV_GPU_URL:-}
      PROD_GPU_URL: ${PROD_GPU_URL:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_PIN_IMAGES_CONTAINER: ${AZURE_STORAGE_PIN_IMAGES_CONTAINER:-}
      AZURE_STORAGE_SCENARIO_IMAGES_CONTAINER: ${AZURE_STORAGE_SCENARIO_IMAGES_CONTAINER:-}
      AZURE_STORAGE_SHORT_IMAGES_CONTAINER: ${AZURE_STORAGE_SHORT_IMAGES_CONTAINER:-}
      DEV_COSMOSDB_USER: ${DEV_COSMOSDB_USER:-}
      DEV_COSMOSDB_PASSWORD: ${DEV_COSMOSDB_PASSWORD:-}
      DEV_COSMOSDB_DBNAME: ${DEV_COSMOSDB_DBNAME:-}
      DEV_COSMOSDB_HOST: ${DEV_COSMOSDB_HOST:-}
      DEV_COSMOSDB_PORT: ${DEV_COSMOSDB_PORT:-}
      PROD_COSMOSDB_USER: ${PROD_COSMOSDB_USER:-}
      PROD_COSMOSDB_PASSWORD: ${PROD_COSMOSDB_PASSWORD:-}
      PROD_COSMOSDB_DBNAME: ${PROD_COSMOSDB_DBNAME:-}
      PROD_COSMOSDB_HOST: ${PROD_COSMOSDB_HOST:-}
      PROD_COSMOSDB_PORT: ${PROD_COSMOSDB_PORT:-}
